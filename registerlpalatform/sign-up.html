<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> signup form</title>
    <link rel="stylesheet" href="sign.css">
</head>
<body>
    <form action="signupform.html">
        <h1>SIGNUP FORM</h1>
        <div class="input-group">
            <input type="text" name="username" placeholder="enter username" required>
        </div>
        <div class="input-group">
            <input type="text" name="first name" placeholder="enter first name" required>
        </div>
        <div class="input-group">
            <input type="text" name="last name" placeholder="enter last name" required>
        </div>
        <tr>
            <td>sex</td>
            <td>
                <input type="radio" name="sex" value="male" > male
                <input type="radio" name="sex" value="female">female
            </td>
        </tr>
        <div  class="input-group">
            <input type="email" name="email" placeholder="enter email" required>
        </div>
        <div class="input-group">
            <input type="number" name="number" placeholder="enter phone number e.g o9xxxxxxxx" required>
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder="enter password" required>
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder="confirm your password" required>
        </div>
        <div class="input-group">
            <button type="submit" name="reg-user" >signup</button>
        </div>
 <div class="input-group">
            <button type="back" name="back" ><a href="wel-sign-up.html" id="back">Back</a></button>
        </div>

    </form>
</body>
</html>
